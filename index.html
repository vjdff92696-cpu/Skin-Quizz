<title>Client Quiz</title>
<style>
/* Layout: burgundy masthead with a pink checker edge, three tabs, one chunky card per question, sticker-style progress and a confetti reveal. */
#bd-quiz{
  --burgundy:#7A1E2C; --burgundy-deep:#5C1420; --pink:#E58FAE; --blush:#F6DDE4; --cream:#FBF3EA; --ink:#2A0F14; --paper:#FFFDF9;
  --display:"Bricolage Grotesque","Arial Black",Arial,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --script:"Yellowtail","Brush Script MT",cursive; --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light; background:var(--cream); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
}
#bd-quiz *{box-sizing:border-box}
#bd-quiz .wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bd-quiz .mast{background:var(--burgundy);color:var(--cream);position:relative}
#bd-quiz .mast .wrap{padding-block:40px 34px}
#bd-quiz .kicker{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);margin:0 0 6px}
#bd-quiz .mast h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,60px);line-height:.95;text-transform:uppercase;letter-spacing:-.01em;margin:0;text-wrap:balance}
#bd-quiz .mast h1 em{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;color:var(--pink);letter-spacing:0}
#bd-quiz .logo{display:block;max-height:80px;max-width:170px;margin:0 0 14px}
#bd-quiz .squiggle{display:block;width:90px;height:12px;margin:14px 0 0}
#bd-quiz .script{font-family:var(--script);font-size:clamp(30px,7vw,44px);line-height:1;color:var(--cream);margin:14px 0 0}
#bd-quiz .checker{height:22px;background:repeating-linear-gradient(90deg,var(--burgundy) 0 22px,transparent 22px 44px),var(--cream);border-bottom:3px solid var(--pink)}
#bd-quiz .tabs{display:flex;gap:8px;flex-wrap:wrap;padding-block:22px 6px}
#bd-quiz .tab{font:700 13px/1 var(--body);letter-spacing:.04em;padding:12px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
#bd-quiz .tab[aria-selected="true"]{background:var(--burgundy);color:var(--cream);border-color:var(--burgundy)}
#bd-quiz .panel{padding-block:14px 56px}
#bd-quiz .card{background:var(--burgundy);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:clamp(20px,5vw,40px);position:relative;overflow:hidden}
#bd-quiz .card.cream{background:var(--paper)}
#bd-quiz .card::before{content:"";position:absolute;inset:0 0 auto;height:10px;background:repeating-linear-gradient(90deg,var(--cream) 0 14px,transparent 14px 24px)}
#bd-quiz .card.cream::before{background:repeating-linear-gradient(90deg,var(--burgundy) 0 14px,transparent 14px 24px)}
#bd-quiz .pill{display:inline-block;font:800 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;background:var(--cream);color:var(--burgundy);padding:7px 11px;border-radius:999px;margin:6px 0 14px}
#bd-quiz h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.5vw,40px);line-height:1;text-transform:uppercase;color:var(--cream);margin:0 0 10px;text-wrap:balance}
#bd-quiz .card.cream h2{color:var(--burgundy);text-shadow:none}
#bd-quiz h3{font:800 13px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--burgundy);margin:0 0 8px}
#bd-quiz p{margin:0;max-width:62ch}
#bd-quiz .lede{color:var(--cream);font-size:15px}
#bd-quiz .card.cream .lede{color:var(--ink)}
#bd-quiz .stickers{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
#bd-quiz .stk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--display);border:2px dashed var(--cream);color:var(--cream);background:transparent}
#bd-quiz .stk.done{background:var(--pink);color:var(--ink);border:2px solid var(--ink);transform:rotate(-8deg)}
#bd-quiz .stk.now{background:var(--cream);border:2px solid var(--ink);color:var(--ink)}
#bd-quiz .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:22px 0 0}
#bd-quiz .opt{display:flex;align-items:center;gap:12px;text-align:left;font:500 15px/1.3 var(--body);color:var(--cream);background:var(--blush);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--cream);transition:transform .12s,box-shadow .12s,background .12s}
#bd-quiz .opt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--cream)}
#bd-quiz .opt[aria-pressed="true"]{background:var(--pink);color:var(--ink);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--cream)}
#bd-quiz .tick{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center}
#bd-quiz .radio .tick{border-radius:50%}
#bd-quiz .opt[aria-pressed="true"] .tick::after{content:"";width:6px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
#bd-quiz .nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 0}
#bd-quiz .btn{display:inline-flex;align-items:center;gap:8px;font:700 14px/1 var(--body);text-decoration:none;padding:15px 22px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);color:var(--burgundy);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
#bd-quiz .btn.solid{background:var(--burgundy);color:var(--cream)}
#bd-quiz .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
#bd-quiz .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
#bd-quiz .link{font:700 13px/1 var(--body);background:none;border:0;color:var(--cream);cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
#bd-quiz :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#bd-quiz .match{font-family:var(--script);font-size:clamp(28px,6vw,40px);color:var(--burgundy);line-height:1;margin:0 0 4px}
#bd-quiz .card.cream .link{color:var(--burgundy)}
#bd-quiz .why{background:var(--cream);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin:18px 0 0;font-size:14px}
#bd-quiz .why.warn{background:var(--cream);margin:0 0 20px}
#bd-quiz .sec{padding:18px 0 0;margin:18px 0 0;border-top:2px dashed var(--pink)}
#bd-quiz ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}
#bd-quiz .rows{display:grid;gap:2px;font-variant-numeric:tabular-nums}
#bd-quiz .rows div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--blush)}
#bd-quiz .rows span:last-child{font-weight:700;color:var(--burgundy);white-space:nowrap}
#bd-quiz .cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 0}
#bd-quiz .socials{margin:14px 0 0;font-weight:600}#bd-quiz .socials a{color:var(--burgundy);text-decoration:underline}#bd-quiz .also{margin:22px 0 0;padding:16px;border-radius:14px;background:var(--cream);border:2px solid var(--ink)}
#bd-quiz .todo{display:inline-block;font-size:12px;font-weight:700;color:var(--burgundy);border:1.5px dashed var(--burgundy);border-radius:6px;padding:1px 7px}
#bd-quiz .small{font-size:13px;margin:20px 0 0}
#bd-quiz .grp{display:grid;gap:18px}
#bd-quiz details{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:4px 16px}
#bd-quiz summary{cursor:pointer;font:800 16px/1.2 var(--display);text-transform:uppercase;color:var(--burgundy);padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
#bd-quiz summary::after{content:"+";font-size:22px;line-height:.8}
#bd-quiz details[open] summary::after{content:"–"}
#bd-quiz .tr-name{font-weight:700}
#bd-quiz .tr{padding:10px 0;border-top:1px solid var(--blush);display:grid;gap:4px}
#bd-quiz .tr .rows div{padding:4px 0;border:0}
#bd-quiz .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
#bd-quiz .chip{font:700 13px/1 var(--body);padding:9px 13px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);cursor:pointer}
#bd-quiz .chip[aria-pressed="true"]{background:var(--burgundy);color:var(--cream)}
#bd-quiz .tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0 0}
#bd-quiz .tcard{background:var(--cream);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
#bd-quiz .tcard:nth-child(3n+2){background:var(--paper)}
#bd-quiz .tname{font-size:18px;letter-spacing:0;margin:0;color:var(--burgundy)}
#bd-quiz .tcard p{font-size:14px}
#bd-quiz .tags{display:flex;flex-wrap:wrap;gap:6px}
#bd-quiz .tag{font:700 11px/1 var(--body);padding:6px 9px;border-radius:999px;background:var(--burgundy);color:var(--cream)}
#bd-quiz .tag.dt{background:var(--paper);color:var(--burgundy);border:1.5px solid var(--burgundy)}
#bd-quiz .tcard .btn{justify-self:start;padding:11px 16px;font-size:13px}
#bd-quiz .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bd-quiz .confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:bd-fall 1.6s ease-in forwards}
@keyframes bd-fall{to{transform:translateY(720px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#bd-quiz *{transition:none!important;animation:none!important}#bd-quiz .confetti{display:none}}
/* results card, treatment info and price list: darker and lighter tan swapped back */
#bd-quiz #bd-card.cream,#bd-quiz #bd-info,#bd-quiz #bd-prices{--burgundy:#AE7B50;--cream:#FAF5EE}
</style>

<div id="bd-quiz">
  <header class="mast"><div class="wrap">
    <p class="kicker"></p>
    <h1></h1>
    <svg class="squiggle" viewBox="0 0 90 12" aria-hidden="true"><path d="M2 8 Q 10 0 18 6 T 34 6 T 50 6 T 66 6 T 88 6" fill="none" stroke="currentColor" style="color:var(--pink)" stroke-width="3" stroke-linecap="round"/></svg>
    <p class="script"></p>
  </div></header>
  <div class="checker" aria-hidden="true"></div>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="bd-tab-quiz" data-tab="quiz" aria-selected="true">The quiz</button>
      <button type="button" class="tab" role="tab" id="bd-tab-info" data-tab="info" aria-selected="false">Treatment info</button>
      <button type="button" class="tab" role="tab" id="bd-tab-prices" data-tab="prices" aria-selected="false">Treatments &amp; prices</button>
      <button type="button" class="tab" role="tab" id="bd-tab-ask" data-tab="ask" aria-selected="false">Got a question?</button>
    </div>
    <section class="panel" id="bd-p-quiz"><div class="card" id="bd-card" aria-live="polite"></div></section>
    <section class="panel" id="bd-p-info" hidden><div class="card cream" id="bd-info"></div></section>
    <section class="panel" id="bd-p-prices" hidden><div class="card cream" id="bd-prices"></div></section>
    <section class="panel" id="bd-p-ask" hidden><div class="card" id="bd-ask"></div></section>
  </div>
</div>

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function txt(v){ return v && v.todo ? '<span class="todo">'+esc(v.todo)+'</span>' : esc(v); }
  function byId(id){ for(var i=0;i<CONCERNS.length;i++) if(CONCERNS[i].id===id) return CONCERNS[i]; }
  function steps(){ var s=["concerns","skin","down","visits","home","health"]; if(PIGQ.length && a.concerns.indexOf("pig")>-1) s.splice(1,0,"pig"); return s; }
  function stickers(){
    var s=steps(),h='<div class="stickers" aria-label="Question '+(step+1)+' of '+s.length+'">';
    for(var i=0;i<s.length;i++) h+='<span class="stk '+(i<step?"done":i===step?"now":"")+'">'+(i<step?"✓":("0"+(i+1)))+'</span>';
    return h+'</div>';
  }
  function opts(list, chosen, multi){
    return '<div class="options '+(multi?"":"radio")+'">'+list.map(function(o){
      var on = multi ? chosen.indexOf(o.id)>-1 : chosen===o.id;
      return '<button type="button" class="opt" data-id="'+o.id+'" aria-pressed="'+on+'"><span class="tick"></span>'+esc(o.label)+'</button>';
    }).join("")+'</div>';
  }
  function nav(ok, last){
    return '<div class="nav">'+(step>0?'<button type="button" class="link" data-act="back">← Back</button>':'<span></span>')+
      '<button type="button" class="btn solid" data-act="next" '+(ok?"":"disabled")+'>'+(last?"Reveal my match ✦":"Next →")+'</button></div>';
  }
  function render(){
    card.className="card";
    var s=steps()[step], q=Q[s], list, chosen=a[s], ok;
    if(s==="concerns"){ list=CONCERNS; chosen=a.concerns; ok=a.concerns.length>0; }
    else if(s==="pig"){ list=PIGQ; chosen=a.pig; ok=a.pig.length>0; }
    else if(s==="main") list=CONCERNS.filter(function(c){return a.concerns.indexOf(c.id)>-1;});
    else if(s==="health"){ list=HEALTH; chosen=a.health; ok=a.health.length>0; }
    else list={skin:SKIN,down:DOWN,visits:VISITS,home:HOME}[s];
    if(s!=="concerns" && s!=="pig" && s!=="health") ok=!!chosen;
    card.innerHTML=stickers()+'<span class="pill">'+q[0]+'</span><h2>'+q[1]+'</h2>'+(q[2]?'<p class="lede">'+q[2]+'</p>':'')+
      opts(list,chosen,s==="concerns"||s==="pig"||s==="health")+nav(ok, step===steps().length-1);
  }

  function list(arr){ return '<ul>'+arr.map(function(x){return '<li>'+txt(x)+'</li>';}).join("")+'</ul>'; }
  function priceRows(t){ return '<div class="rows">'+t.prices.map(function(p){return '<div><span>'+txt(p[0])+'</span><span>'+txt(p[1])+'</span></div>';}).join("")+'</div>'; }

  function confetti(){
    var c=document.createElement("div"), cols=[BRAND.colours.main,BRAND.colours.accent,BRAND.colours.background,BRAND.colours.text]; c.className="confetti";
    for(var i=0;i<40;i++){ var p=document.createElement("i"); p.style.left=Math.random()*100+"%"; p.style.background=cols[i%4]; p.style.animationDelay=(Math.random()*.5)+"s"; c.appendChild(p); }
    card.appendChild(c); setTimeout(function(){ c.remove(); },2400);
  }

  function result(){
    var main = byId(a.main || a.concerns[0]), picks = ranked(main,a), key = picks[0], t = T[key];
    var why = 'Based on your concern ('+esc(main.label.toLowerCase())+'), '+
      (a.visits==="monthly"?"your commitment to monthly treatments":a.visits==="few"?"coming in once or twice":"not being sure how often you can come in")+
      ', '+(a.home==="daily"?"a daily homecare routine":a.home==="some"?"some homecare":"keeping homecare minimal")+
      ' and '+(a.down==="none"?"needing no downtime":"being happy with a few days of downtime")+'.';
    if(main.id==="pig"){ var pt=PIGTYPE[pigType(a)]; if(pt.name) why+=' Your answers suggest '+pt.name+', which needs the right approach so it doesn\'t come back.'; }
    if(!suits(t,a)) why+=' This treatment works best as a course, so we will talk through a plan that fits you at your consultation.';
    var others = picks.slice(1,3);
    a.concerns.forEach(function(id){ if(id!==main.id){ var k=ranked(byId(id),a)[0]; if(k!==key && others.indexOf(k)<0) others.push(k); } });
    var preg = a.health.indexOf("preg")>-1, flag = a.health.some(function(x){ return x!=="none" && x!=="preg"; }), care = preg||flag;
    card.className="card cream";
    card.innerHTML=(preg?'<p class="why warn">'+esc(PREG_NOTE)+'</p>':'')+(flag?'<p class="why warn">'+esc(HEALTH_NOTE)+'</p>':'')+
      '<p class="match">Your perfect match</p><h2>'+txt(t.name)+'</h2><p>'+txt(t.desc)+'</p><p class="why">'+why+'</p>'+
      '<div class="sec"><h3>Before your treatment</h3>'+list(t.pre)+'</div>'+
      '<div class="sec"><h3>Aftercare</h3>'+list(t.post)+'</div>'+
      '<div class="sec"><h3>Prices</h3>'+priceRows(t)+'</div>'+
      (care ? '<div class="cta"><a class="btn solid" href="'+BOOK_CONSULT+'" target="_blank" rel="noopener">Book a consultation</a></div>'
            : '<div class="cta"><a class="btn solid" href="'+t.book+'" target="_blank" rel="noopener">Book this treatment</a><a class="btn" href="'+BOOK_CONSULT+'" target="_blank" rel="noopener">Book a consultation</a></div>')+
      (others.length?'<div class="also"><h3>Also suited to you</h3><p>'+others.map(function(k){return txt(T[k].name);}).join(", ")+'. We can talk these through at your consultation.</p></div>':'')+
      '<div class="also"><h3>Any more questions?</h3><p>DM us the word <b>'+esc(DM_KEYWORD)+'</b> on Instagram and we will get straight back to you.</p><div class="cta" style="margin-top:12px"><a class="btn" href="'+INSTAGRAM+'" target="_blank" rel="noopener">Message us on Instagram</a></div>'+'<p class="socials">Follow us: <a href="'+INSTAGRAM+'" target="_blank" rel="noopener">Instagram</a>'+(FACEBOOK?' · <a href="'+FACEBOOK+'" target="_blank" rel="noopener">Facebook</a>':'')+'</p>'+'</div>'+
      (NEW_CLIENT.title?'<div class="also"><h3>'+esc(NEW_CLIENT.title)+'</h3><p>'+esc(NEW_CLIENT.text)+'</p><div class="cta" style="margin-top:12px"><a class="btn" href="'+NEW_CLIENT.link+'" target="_blank" rel="noopener">'+esc(NEW_CLIENT.button)+'</a></div></div>':'')+
      '<div class="nav"><button type="button" class="link" data-act="restart">↺ Take the quiz again</button><button type="button" class="link" data-act="prices">See all prices</button></div>';
    confetti();
  }

  card.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    var s=steps()[step];
    if(b.dataset.id){
      var id=b.dataset.id;
      if(s==="concerns"){ var i=a.concerns.indexOf(id); i>-1?a.concerns.splice(i,1):a.concerns.push(id); if(a.concerns.indexOf(a.main)<0) a.main=null; if(a.concerns.indexOf("pig")<0) a.pig=[]; }
      else if(s==="pig"){ if(id==="none") a.pig=["none"]; else { a.pig=a.pig.filter(function(x){return x!=="none";}); var j=a.pig.indexOf(id); j>-1?a.pig.splice(j,1):a.pig.push(id); } }
      else if(s==="health"){ if(id==="none") a.health=["none"]; else { a.health=a.health.filter(function(x){return x!=="none";}); var h=a.health.indexOf(id); h>-1?a.health.splice(h,1):a.health.push(id); } }
      else a[s]=id;
      render(); return;
    }
    if(b.dataset.act==="back"){ step--; render(); }
    else if(b.dataset.act==="next"){ if(step===steps().length-1){ result(); card.scrollIntoView({block:"start",behavior:"smooth"}); } else { step++; render(); } }
    else if(b.dataset.act==="restart") reset();
    else if(b.dataset.act==="prices") show("prices");
  });

  /* prices tab */
  document.getElementById("bd-prices").innerHTML='<span class="pill">Price list</span><h2>Treatments &amp; prices</h2><p class="lede">Tap a category to open it.</p><div class="grp" style="margin-top:20px">'+
    PRICELIST.map(function(g,gi){ return '<details'+(gi===0?' open':'')+'><summary>'+esc(g.name)+'</summary>'+(g.intro?'<p class="small" style="margin:0 0 8px">'+esc(g.intro)+'</p>':'')+'<div class="tr">'+priceRows({prices:g.items})+'</div></details>'; }).join("")+
    '</div><div class="cta"><a class="btn solid" href="'+BOOK+'" target="_blank" rel="noopener">Book now</a></div>';

  /* treatment info tab */
  var info=document.getElementById("bd-info"), filt="all";
  function goodFor(k){ return CONCERNS.filter(function(c){ return c.fits.indexOf(k)>-1 || (c.id==="pig" && [].concat(PIGTYPE.melasma.fits,PIGTYPE.pih.fits,PIGTYPE.other.fits).indexOf(k)>-1); }); }
  function renderInfo(){
    var keys=[]; GROUPS.forEach(function(g){ keys=keys.concat(g.items); });
    if(filt!=="all") keys=keys.filter(function(k){ return goodFor(k).some(function(c){return c.id===filt;}); });
    info.innerHTML='<span class="pill">Treatment info</span><h2>Get to know our treatments</h2><p class="lede">Filter by what you would like to treat.</p>'+
      '<div class="chips">'+[{id:"all",label:"All"}].concat(CONCERNS).map(function(c){return '<button type="button" class="chip" data-f="'+c.id+'" aria-pressed="'+(filt===c.id)+'">'+esc(c.label)+'</button>';}).join("")+'</div>'+
      '<div class="tcards">'+keys.map(function(k){ var t=T[k];
        return '<article class="tcard"><h3 class="tname">'+txt(t.name)+'</h3><p>'+txt(t.desc)+'</p>'+
          '<div class="tags">'+goodFor(k).map(function(c){return '<span class="tag">'+esc(c.label)+'</span>';}).join("")+
          '<span class="tag dt">'+DOWNTXT[t.down]+'</span><span class="tag dt">'+(t.plan==="course"?"Monthly course":"One-off or occasional")+'</span></div>'+
          '<a class="btn" href="'+t.book+'" target="_blank" rel="noopener">Book →</a></article>'; }).join("")+'</div>';
  }
  info.addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(b){ filt=b.dataset.f; renderInfo(); } });
  renderInfo();

  /* questions tab */
  document.getElementById("bd-ask").innerHTML='<span class="pill">Got a question?</span><h2>Ask us anything</h2>'+
    '<p class="lede">Not sure about something? DM us the word <b>'+esc(DM_KEYWORD)+'</b> on Instagram and we will get straight back to you, or book a consultation and we will talk it all through.</p>'+
    '<div class="cta"><a class="btn solid" href="'+INSTAGRAM+'" target="_blank" rel="noopener">Message us on Instagram</a><a class="btn" href="'+BOOK_CONSULT+'" target="_blank" rel="noopener">Book a consultation</a></div>'+'<p class="socials">Follow us: <a href="'+INSTAGRAM+'" target="_blank" rel="noopener">Instagram</a>'+(FACEBOOK?' · <a href="'+FACEBOOK+'" target="_blank" rel="noopener">Facebook</a>':'')+'</p>';

  /* tabs */
  var root=document.getElementById("bd-quiz");
  function show(name){
    root.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.dataset.tab===name); });
    ["quiz","info","prices","ask"].forEach(function(n){ document.getElementById("bd-p-"+n).hidden = n!==name; });
  }
  root.querySelector(".tabs").addEventListener("click",function(e){ var t=e.target.closest(".tab"); if(t) show(t.dataset.tab); });
  reset();
})();
</script>
